<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>F26 Command Center</title>
  <meta name="description" content="Every graded obligation for Fall 2026: deadlines, weights, crunch weeks, grades and course intel.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' stroke='white' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand-row">
        <div class="brand">
          <div class="brand-mark">F26</div>
          <div>
            <h1>Course Command Center</h1>
            <div class="today" id="todayLabel"></div>
          </div>
        </div>
        <div class="top-actions">
          <button class="icon-btn" id="icsBtn" title="Download every deadline as a calendar file (.ics)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18M12 14v4M10 16h4"/></svg>
            <span class="hide-sm">.ics</span>
          </button>
          <button class="icon-btn" id="themeBtn" title="Toggle light/dark">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          </button>
        </div>
      </div>
      <nav class="tabs" role="tablist">
        <button class="tab" role="tab" data-view="dashboard">Dashboard</button>
        <button class="tab" role="tab" data-view="timeline">Timeline</button>
        <button class="tab" role="tab" data-view="calendar">Calendar</button>
        <button class="tab" role="tab" data-view="courses">Courses</button>
        <button class="tab" role="tab" data-view="grades">Grades</button>
        <button class="tab" role="tab" data-view="week">Week</button>
      </nav>
    </div>
  </header>

  <main>
    <section class="view" id="view-dashboard"></section>
    <section class="view" id="view-timeline"></section>
    <section class="view" id="view-calendar"></section>
    <section class="view" id="view-courses"></section>
    <section class="view" id="view-grades"></section>
    <section class="view" id="view-week"></section>
  </main>

  <footer>
    Built from the official F26 course outlines. Outlines can change: CourseLink / Moodle and your uoguelph.ca email are the source of truth.
    Your check-offs and grades are saved only in this browser.
  </footer>

  <div class="tooltip" id="tooltip"></div>
  <script src="data.js?v=3"></script>
  <script src="app.js?v=3"></script>
</body>
</html>
